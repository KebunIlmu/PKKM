
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-PKKM Tahunan - Upload Bukti Fisik Terperinci</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-school-flag"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">E-PKKM TAHUNAN</h1>
                    <p class="text-xs text-emerald-100">Upload Bukti Otentik Terperinci per Poin Dokumen</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <input type="text" id="gasUrlInput" placeholder="URL Web App Google Apps Script" class="px-3 py-2 text-xs rounded-xl bg-emerald-800/60 border border-emerald-600 text-white placeholder-emerald-300 focus:outline-none focus:ring-2 focus:ring-white w-64">
                <button onclick="saveGasUrl()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl shadow transition">Simpan URL GAS</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Identitas Madrasah -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4"><i class="fa-solid fa-id-card text-emerald-600 mr-2"></i> Identitas Madrasah & Kepala Madrasah</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Kepala Madrasah</label>
                    <input type="text" id="namaKamad" placeholder="Nama lengkap & gelar" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Madrasah</label>
                    <input type="text" id="namaMadrasah" placeholder="Contoh: MAN 1..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tahun Penilaian</label>
                    <input type="text" id="tahunPenilaian" value="2026" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
        </div>

        <!-- Komponen Instrumen -->
        <div id="instrumenContainer" class="space-y-6">
            <!-- Data dirender dinamis -->
        </div>

    </main>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
