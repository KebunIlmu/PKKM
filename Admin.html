<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Manajemen Sekolah PKKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 p-6">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold text-slate-800"><i class="fa-solid fa-gears text-emerald-600 mr-2"></i> Panel Admin - Input Sekolah & URL GAS</h1>
                <p class="text-xs text-slate-500">Daftarkan sekolah dan URL Google Apps Script untuk mulai penilaian.</p>
            </div>
            <div class="flex gap-2">
                <a href="guru.html" class="px-3 py-2 bg-emerald-600 text-white text-xs font-semibold rounded-xl hover:bg-emerald-700 transition">Panel Guru</a>
                <a href="penilaian.html" class="px-3 py-2 bg-slate-800 text-white text-xs font-semibold rounded-xl hover:bg-slate-900 transition">Panel Asesor</a>
            </div>
        </div>

        <!-- Form Input Admin -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Tambah / Atur Data Sekolah</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Sekolah / Madrasah</label>
                    <input type="text" id="inputNamaSekolah" placeholder="Contoh: MAN 1 Semarang" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Kepala Madrasah & Gelar</label>
                    <input type="text" id="inputNamaKamad" placeholder="Nama lengkap & gelar" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">URL Web App Google Apps Script (GAS)</label>
                <input type="text" id="inputGasUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Tahun Penilaian</label>
                <input type="text" id="inputTahun" value="2026" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500">
            </div>

            <button onclick="simpanSekolah()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl shadow transition">
                <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Data Sekolah
            </button>
        </div>

        <!-- Daftar Sekolah Terdaftar -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-4">Daftar Sekolah Terdaftar</h2>
            <div id="listSekolah" class="space-y-3">
                <p class="text-xs text-slate-500">Memuat data sekolah...</p>
            </div>
        </div>

    </div>

    <!-- Script Admin -->
    <script src="Admin.js"></script>
</body>
</html>
